[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "relayout"
version = "0.1.0"
description = "Layout transformation sequences on SDFGs: GPU linear layouts and distributed (MPI, NCCL/RCCL) data movement"
readme = "README.md"
requires-python = ">=3.12, <3.15"
# relayout.ops (the op schema and its lowering) imports nothing past the standard library; the SDFG passes
# and kernels need dace. hpcagent-bench depends on relayout, so relayout never depends on it.
dependencies = [
    "dace",
    "numpy>=2.3.2",
    "islpy",
    "z3-solver",
]

[project.optional-dependencies]
mpi = ["mpi4py"]
# The Fortran kernels: dace-fortran builds its nanobind bridge on first use but lists nanobind only in its
# testing group.
fortran = ["dace-fortran", "nanobind"]

[dependency-groups]
dev = ["pytest", "pytest-timeout", "ruff", "pre-commit", "ml-dtypes"]

[tool.uv.sources]
# dace comes from the override below, not from a source: uv applies a git dependency's sources, so a dace source here
# would conflict with the dace commit a project that depends on relayout (hpcagent-bench) pins.
dace-fortran = { git = "https://github.com/spcl/dace-fortran.git", branch = "main" }

[tool.uv]
# relayout as the root project: dace@extended, also over the dace@FaCe dace-fortran pins.
override-dependencies = ["dace @ git+https://github.com/spcl/dace.git@extended"]

[tool.hatch.build.targets.wheel]
packages = ["src/relayout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--maxfail=10 -ra"
timeout = 1800
markers = [
    "mpi: needs mpirun -n >= 2",
    "fortran: needs an LLVM flang (dace_fortran.llvm_toolchain.find_flang)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# Copied verbatim from dace@extended tests/transformations/layout/kernels.
"src/relayout/benchmarks/k*.py" = ["E731"]
